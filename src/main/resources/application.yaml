spring:
  application:
    name: microblogX
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:sqlite:db.microblogX
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    web:
      pageable:
        max-page-size: 50

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}